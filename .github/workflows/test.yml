name: Tests

# Why this exists separately from "Release VSIX": that workflow runs the suite
# only on `release: published`, and only on ubuntu. Both halves of that cost
# this project a released defect. v1.4.1 was a one-fix patch for a lock-reclaim
# boundary that compared `Date.now() - stat.mtimeMs <= staleMs` -- mtimeMs
# carries sub-millisecond precision while Date.now() is whole milliseconds, so a
# just-written file could read as being from the future. Windows hid it because
# the intervening lock attempt burns more than a millisecond of file operations;
# Linux did not. It reached a published release because nothing ran the suite
# until release time, and 60 consecutive local runs of the broken code passed.
#
# So: run on every push and PR, and run on BOTH platforms. The suite has one
# POSIX-only skip, which is expected on windows-latest.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel the other platform on one failure: a platform-specific
      # failure is the single most useful signal this matrix produces, and
      # fail-fast would hide whether the other side agreed.
      fail-fast: false
      # Node 24 since 2026-10-14: it is the runtime the extension actually runs on (the
      # VS Code extension host is Node 24.21, Electron 43.7.7) and nothing in CI tested it.
      # It gets no Codex install: the Node 22 legs carry the Codex contract tests, and 24
      # is here for the runtime, with node:sqlite present as it is in the host.
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22", "24"]
    env:
      # The Codex CLI the contract tests run against, pinned (2026-10-13).
      # scripts/check-codex-version.js refuses a pin that is not a recorded
      # tested version, so bumping this line without new evidence in
      # docs/codex-compatibility.md and src/codex-version.js fails the job.
      CODEX_VERSION: "0.161.0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # CODEX ON THE NODE 22 LEGS ONLY (2026-10-13). test/codex-contract.test.js
      # and test/codex-guidance-matrix.test.js ask the real `codex execpolicy
      # check` -- the local rule checker, no provider and no auth -- and skipped
      # here for want of a binary, so CI never asked Codex anything. The npm
      # package is a launcher plus a per-platform optional dependency
      # (@openai/codex-linux-x64 / -win32-x64 at the same version), which npm
      # resolves on both runners; on Windows the global install is a .cmd shim,
      # the exact shape src/exec-resolve.js exists to launch.
      #
      # The Node 20 legs stay WITHOUT Codex on purpose: they exist to catch the
      # node:sqlite asymmetry, and they keep proving that the suite still passes,
      # loudly skipping, on a machine that has no Codex at all.
      #
      # This is a dependency install, so the "no install step" note below still
      # holds for the project itself: it has no dependencies of its own.
      - name: Install pinned Codex CLI
        if: matrix.node == '22'
        run: npm install --global @openai/codex@${{ env.CODEX_VERSION }}

      # Fails loudly unless the binary the PRODUCT would launch (same resolver
      # the tests use) prints exactly the pinned version.
      - name: Verify the codex the tests will launch
        if: matrix.node == '22'
        run: node scripts/check-codex-version.js --expect ${{ env.CODEX_VERSION }}

      # No install step on purpose: this project has no runtime dependencies and
      # no devDependencies, so `npm ci` would fail for want of a lockfile. If a
      # dependency is ever added, this is the line that has to change.
      #
      # ACOLYTE_REQUIRE_CODEX turns the Codex tests' skip into a FAILURE on the
      # legs that installed it, so a broken install or resolver cannot quietly
      # put them back to skipping while the job stays green. Empty on Node 20.
      - name: Test
        run: npm test
        env:
          ACOLYTE_REQUIRE_CODEX: ${{ matrix.node == '22' && env.CODEX_VERSION || '' }}

      # The pack must stay closed under the Bash -> PowerShell mirroring rule.
      # `npm test` already asserts this, but running the reporter surfaces WHAT
      # drifted in the log rather than only that something did.
      - name: Starter pack mirror check
        run: node scripts/mirror-pack.js

  # The Python half of retiring and restoring memory gates (2026-10-14, ported from rampage
  # e5c0ee7): recall.py --gates-list, --gates-retire and --gates-restore, the snapshot they take
  # first and its keep-30 prune, the gate-edit lock, and per-agent gates surviving a retire byte
  # for byte, all in a throwaway HOME. recall.py checks that numpy and onnxruntime are INSTALLED
  # before every verb, these included, so the job installs both even though no model is
  # downloaded. The pins are the ones rampage's CI runs this script against.
  #
  # CI=true is set explicitly as well as by GitHub: test/gates-manage.sh turns a missing
  # interpreter from a local SKIP into a FAILURE under it, so this job cannot report green having
  # run nothing. test/recall-py.sh and test/gates-stale.sh are NOT here: they skip on a missing
  # interpreter whatever CI says, and they were never run on these runners, so they stay the
  # local checks they were written as until someone makes and proves that move.
  gates-manage:
    name: recall.py gate edits on Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.11"

      - name: Install recall.py's runtime
        run: python -m pip install numpy==2.4.6 onnxruntime==1.30.0

      - name: test/gates-manage.sh
        env:
          CI: "true"
          TOOLBOX_PYTHON: ${{ steps.py.outputs.python-path }}
        run: bash test/gates-manage.sh

      # recall.py --threads-compile (2026-10-19): the open-threads selection, format, caps, the
      # header-only file, the INDEX line, the refusals, --lint, and memoryLint.js threadOf and
      # indexHealth held to Python's reading over a generated corpus. The agreement half runs
      # node, which the ubuntu runner image carries; under CI=true a missing node or Python is a
      # FAILURE, not a skip, so this step cannot report green having run nothing.
      - name: test/threads-compile.sh
        env:
          CI: "true"
          TOOLBOX_PYTHON: ${{ steps.py.outputs.python-path }}
        run: bash test/threads-compile.sh

  # A separate job, because it needs a shell the matrix above cannot give it.
  #
  # install.ps1 once replaced the user's whole settings.json with nothing but its
  # own hook entry: `ConvertFrom-Json -AsHashtable` is PowerShell 6+ only, so
  # under Windows PowerShell 5.1 it threw, the catch merely warned, and the write
  # went ahead. README names `.\install.ps1  # Windows PowerShell` with no version
  # requirement, so 5.1 is a supported shell.
  #
  # Nothing in the matrix job can catch that. GitHub's default shell on
  # windows-latest is `pwsh` (PowerShell 7), which is exactly the edition where
  # the parameter works and the bug does not exist — and both installers PARSE
  # clean under 5.1, so a syntax check sees nothing either. `shell: powershell` is
  # GitHub's alias for powershell.exe, i.e. Windows PowerShell 5.1.
  #
  # test/installers.test.js covers install.sh and uninstall.sh behaviourally on
  # every platform and guards the .ps1 pair statically. This is the behavioural
  # half of the .ps1 story.
  installers:
    name: installers on Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: install.ps1 / uninstall.ps1 behaviour
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "expected Windows PowerShell 5.1; got $($PSVersionTable.PSVersion). This job is worthless under pwsh."
          }
          .\scripts\verify-installers.ps1
